name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A formatting or lint verdict does not depend on the version of node. In
      # the matrix the same complaint would be reported twice, labelled with a
      # version that has nothing to do with it. No `needs` either: a formatting
      # nit must never hide a failing test, so both jobs start at once.
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only. data.bnf.fr is a query service a public institution pays
      # for, and shared runners have no business adding load to it on every push.
      # The nightly canary is where the real endpoint is exercised.
      - run: npm test
      - run: npm run build
