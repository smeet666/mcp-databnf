name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job reads the repository and nothing else, so it is handed a token that
# can do nothing else either.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A formatting or lint verdict does not depend on the version of node. In
      # the matrix the same complaint would be reported twice, labelled with a
      # version that has nothing to do with it. No `needs` either: a formatting
      # nit must never hide a failing test, so both jobs start at once.
      - run: npm run check

      # The corpus the unit tests read is written into the repository, so a
      # generator edited without regenerating leaves the suite reading a corpus
      # nobody meant. Regenerating here and asking for no difference is what
      # says so, rather than letting a stale corpus pass unnoticed.
      - name: The committed corpus is the one the generator writes
        run: |
          npm run build:fixtures
          git diff --exit-code test/fixtures

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only. data.bnf.fr is a query service a public institution pays
      # for, and shared runners have no business adding load to it on every push.
      # The nightly canary is where the real endpoint is exercised.

      # Three consecutive identical passes is the gate: a suite that varies
      # between runs is a defect whatever any single run reports.
      - run: for i in 1 2 3; do npm test || exit 1; done
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t "${{ github.event.repository.name }}:ci" .
      # A recipe that builds says nothing about what it built: the entry point is
      # a path inside the image, and a wrong one only shows when something starts
      # it. One initialize over stdio is what says the image holds a server.
      - name: Start the image and read what it answers
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 60 docker run -i --rm "${{ github.event.repository.name }}:ci" \
            | grep -q '"serverInfo"'
